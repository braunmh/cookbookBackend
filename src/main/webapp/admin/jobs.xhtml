<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="./../common.xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:comp="jakarta.faces.composite/comp"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core">
    <ui:define name="css">
    </ui:define>

    <ui:define name="navigation">
        <comp:navigation/>
    </ui:define>

    <ui:define name="content">
        <p:dataTable id="result" var="row" value="#{jobBean.jobs}" 
                     paginator="true" rows="10" rendered="#{not empty jobBean.jobs}"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     currentPageReportTemplate="{startRecord}-{endRecord} von {totalRecords}"
                     rowsPerPageTemplate="10,20,40">
            <p:column id="col-type" headerText="Name" sortBy="#{row.type}" filterBy="#{row.type}" filterMatchMode="contains" field="type">
                <h:outputText value="#{row.type}"/>
            </p:column>
            <p:column id="col-status" headerText="Status" sortBy="#{row.status}" filterBy="#{row.status}" filterMatchMode="contains" field="status">
                <h:outputText value="#{row.status}"/>
            </p:column>
            <p:column id="col-started" headerText="Datum" sortBy="#{row.started}" filterBy="#{row.started}" filterMatchMode="contains" field="started">
                <h:outputText value="#{row.started}">
                    <f:convertDateTime type="both"/>
                </h:outputText>
            </p:column>
            <p:column id="col-message" headerText="Message" sortBy="#{row.message}" filterBy="#{row.message}" filterMatchMode="contains" field="message">
                <h:outputText value="#{row.message}"/>
            </p:column>
            <p:column id="col-information" headerText="Information">
                <h:outputText value="#{row.information}"/>
            </p:column>
            <p:column id="col-action" style="width: 10rem">
                <p:commandButton id="start" process="@this" icon="pi pi-file-edit"
                                 styleClass="ui-button-flat"
                                 actionListener="#{jobBean.startJob}">
                    <f:attribute name="job" value="#{row}"/>
                </p:commandButton>
            </p:column>
        </p:dataTable>
    </ui:define>

</ui:composition>
