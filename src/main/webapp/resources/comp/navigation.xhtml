<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:cc="jakarta.faces.composite">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="hasAside" type="java.lang.Boolean" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <div class="main-nav">
            <div style="width: 100%">
                <p:commandButton id="mainmenu-btn" value="" type="button" icon="pi pi-bars"/>
            </div>
            <h:panelGroup id="aside-btn" layout="block" rendered="#{cc.attrs.hasAside}" styleClass="aside-btn">
                <span></span>
            </h:panelGroup>
        </div>
        <p:menu overlay="true" trigger="mainmenu-btn" my="left top" at="left bottom" toggleable="true">
            <p:submenu label="Suchen">
                <p:menuitem value="Rezepte suchen" url="#" icon="pi pi-fw pi-search" partialSubmit="true"/>
                <p:menuitem value="News" url="#" icon="pi pi-fw pi-search" partialSubmit="true" />
            </p:submenu>
            <p:submenu label="Administration">
                <p:menuitem value="Import" icon="pi-fw pi pi-search" url="#"/>
                <p:menuitem value="Stichwörter" icon="pi-fw pi pi-database" url="#"/>
                <p:menuitem value="Suchindex aktualisieren"  url="#" icon="pi-fw pi pi-database"/>
            </p:submenu>
        </p:menu>
    </cc:implementation>
</ui:composition>
