<ui:composition xmlns="http://www.w3.org/1999/xhtml"
              xmlns:cc="jakarta.faces.composite"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:h="jakarta.faces.html"
              xmlns:p="primefaces">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="hasAside" type="java.lang.Boolean" default="false"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <div class="main-nav">
            <table style="width: 100%">
                <tr>
                    <td >
                        <p:commandButton id="mainmenu-btn" value="" type="button" style="width: 2em;" icon="pi pi-bars"/>
                    </td>
                    <td ></td>
                    <td style="text-align: right">
                        <p:commandButton id="aside-btn" value="" type="button" style="width: 2em;"
                            icon="pi pi-ellipsis-v" rendered="#{cc.attrs.hasAside}"/>
                        <cc:insertChildren/>
                    </td>
                </tr>
            </table>
        </div>
        <p:menu overlay="true" trigger="mainmenu-btn" my="left top" at="left bottom" toggleable="true">
            <p:submenu label="Suchen">
                <p:menuitem value="Rezepte suchen" outcome="/recipe/search.xhtml" icon="pi pi-fw pi-search" partialSubmit="true"/>
                <p:menuitem value="News" outcome="/recipe/news.xhtml" icon="pi pi-fw pi-search" partialSubmit="true" />
            </p:submenu>
            <p:submenu label="Administration">
                <p:menuitem value="Job" icon="pi-fw pi pi-database" outcome="/admin/jobs"/>
                <p:menuitem value="Stichwörter" icon="pi-fw pi pi-database" action="#{adminBean.refreshCaches()}"/>
            </p:submenu>
        </p:menu>
    </cc:implementation>
</ui:composition>
